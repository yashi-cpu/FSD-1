version: '3.8'

services:
  # FastAPI Application
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=securecode_ai
      - DATABASE_URL=postgresql://securecode_user:securecode_pass@db:5432/securecode_db
    depends_on:
      - mongo
    volumes:
      - .:/app

  # MongoDB Document Database (Section 11 NoSQL Store & GridFS)
  mongo:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Mongo Express (Web UI for viewing MongoDB documents at http://localhost:8081)
  mongo-express:
    image: mongo-express:1.0.2-20
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo

  # Optional PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=securecode_user
      - POSTGRES_PASSWORD=securecode_pass
      - POSTGRES_DB=securecode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data:
